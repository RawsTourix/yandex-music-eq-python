name: Backfill initial v0.1.0 tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-v0.1.0.yml'

permissions:
  contents: write

jobs:
  tag-original-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate original commit and create tag safely
        shell: bash
        run: |
          set -euo pipefail
          target="80b4aac521ecf20f25053783b37b76be023a9c6d"
          version="v0.1.0"
          git cat-file -e "$target^{commit}"
          git merge-base --is-ancestor "$target" HEAD
          subject="$(git show -s --format=%s "$target")"
          if [[ "$subject" != "feat: initial Windows Yandex Music EQ Python MVP (#1)" ]]; then
            echo "::error::Original commit title does not match expected release"
            exit 1
          fi
          if git ls-remote --tags --refs origin "refs/tags/$version" | grep -q .; then
            echo "::error::Tag $version already exists, refusing to overwrite"
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$version" "$target" -m "Release $version - initial working Windows MVP"
          git push origin "refs/tags/$version"
          echo "Created $version pointing to $target"
